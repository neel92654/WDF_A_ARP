<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Student Hub</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: blue;
        }

        .login-box {
            border: 2px solid black;
            width: 400px;
            height: 300px;
            margin: auto;
            padding: 20px;
            text-align: center;
            background-color: white;
            border-radius: 8px;
            box-shadow: 3px 3px 8px gray;
        }

        .logo {
            display: block;
            margin: auto;
        }

        input[type="text"],
        input[type="password"] {
            width: 180px;
            padding: 5px;
        }

        input[type="submit"] {
            padding: 8px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: darkblue;
        }

        .footer {
            text-align: center;
        }

        .footer a {
            text-decoration: none;
            color: black;
        }

        .footer a:hover {
            color: blue;
        }

    </style>
</head>

<body>
    <br><br><br>
    <h1>WELCOME TO CHARUSAT STUDENT HUB PORTAL</h1>
    <br><br>
    <div class="login-box">
        <img src="../images/image.png" alt="Charusat Logo" width="200" height="50" class="logo">
        <br>
        <p style="font-size:18px;">-- Gateway to Student Hub --</p>
        <br>
        <form action="dashboard.html" method="post">
            <label for="username">Username :</label>
            <input type="text" id="username" name="username">
            <br><br>
            <label for="password">Password :</label>
            <input type="password" id="password" name="password">
            <br>
            <p>Forgot your password?</p>
            <input type="submit" value="Login">
        </form>
    </div>
    <br><br>
    <div class="footer">
        <a href="#">About</a> |
        <a href="mailto:25dce087@charusat.edu.in">Contact</a> |
        <a href="login.html">Logout</a>
    </div>
</body>
</html>
