<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5">
    <title>Student Hub</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <br><br><br>
    <h1>WELCOME TO CHARUSAT STUDENT HUB PORTAL</h1>
    <br><br>
    <div class="login-box">
        <img src="../images/image.png" alt="Charusat Logo" width="200" height="50" class="logo">
        <br>
        <p style="font-size:18px;">-- Gateway to Student Hub --</p>
        <br>
        <form action="dashboard.html" method="post">
            <label for="username">Username :</label>
            <input type="text" id="username" name="username">
            <br><br>
            <label for="password">Password :</label>
            <input type="password" id="password" name="password">
            <br>
            <p>Forgot your password?</p>
            <input type="submit" value="Login">
        </form>
    </div>
    <br><br>
    <div class="footer">
        <a href="#">About</a> |
        <a href="mailto:25dce087@charusat.edu.in">Contact</a> |
        <a href="login.html">Logout</a>
    </div>
    <script>
        document.querySelector('form').addEventListener('submit', function (event) {
            var username = document.getElementById('username').value.trim();
            var password = document.getElementById('password').value.trim();

            if (username === "" || password === "") {
                alert("Please fill in both Username and Password fields.");
            }
        });
    </script>
</body>

</html>
