<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal Login - CHARUSAT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="login.html">
            <img src="../images/image.png" alt="CHARUSAT Logo" height="36" class="d-inline-block align-text-top me-2 bg-white rounded p-1">
            <span class="fw-bold">CHARUSAT STUDENT HUB</span>
        </a>
        <div class="ms-auto">
            <button class="btn btn-outline-light btn-sm" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle Light/Dark Theme">
                <span id="themeIcon">☾</span> <span id="themeText" class="d-none d-sm-inline">Dark</span>
            </button>
        </div>
    </div>
</nav>

<main class="container my-auto py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row w-100 justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <img src="../images/image.png" alt="CHARUSAT Logo" height="42" class="mb-3">
                        <h2 class="h4 fw-bold text-primary mb-1">Student Portal Login</h2>
                        <p class="text-muted small">Access your academic records and dashboard</p>
                    </div>

                    <form action="dashboard.html" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username / Enrollment No.</label>
                            <input type="text" id="username" name="username" class="form-control" placeholder="e.g. 25DCE087" autocomplete="username">
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label fw-semibold mb-0">Password</label>
                                <a href="#" class="text-decoration-none small">Forgot password?</a>
                            </div>
                            <input type="password" id="password" name="password" class="form-control mt-1" placeholder="Enter your password" autocomplete="current-password">
                        </div>

                        <div class="d-grid mt-4">
                            <input type="submit" value="Sign In" class="btn btn-primary py-2 fw-semibold">
                        </div>

                        <div class="text-center mt-3 pt-2 border-top">
                            <span class="text-muted small">New student? </span>
                            <a href="register.html" class="text-decoration-none small fw-semibold">Register for portal</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-white text-center py-3 mt-auto border-top">
    <div class="container">
        <div class="mb-2">
            <a href="about.html" class="text-decoration-none text-muted mx-2">About</a> |
            <a href="contact.html" class="text-decoration-none text-muted mx-2">Contact</a> |
            <a href="login.html" class="text-decoration-none text-muted mx-2">Login</a>
        </div>
        <p class="text-muted small mb-0">&copy; 2026 CHARUSAT Student Hub - Charotar University of Science and Technology</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/common.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
