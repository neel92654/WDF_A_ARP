        <b>Settings</b>

    <br>
    <div style="border:2px solid black; width:700px; margin:auto; padding:20px; background-color:white; border-radius:8px; box-shadow:3px 3px 8px gray;">
        <h2 style="text-align:center;">Account Settings</h2>
        <form>
            <table>
                <tr>
                    <td><b>Change Password</b></td>
                    <td><input type="password" placeholder="Enter New Password"></td>
                </tr>
                <tr>
                    <td><b>Confirm Password</b></td>
                    <td><input type="password" placeholder="Confirm Password"></td>
                </tr>
                <tr>
                    <td><b>Language</b></td>
                    <td>
                        <select>
                            <option>English</option>
                            <option>Hindi</option>
                            <option>Gujarati</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td><b>Email Notifications</b></td>
                    <td>
                        <input type="checkbox" checked> Enable
                    </td>
                </tr>
                <tr>
                    <td><b>SMS Notifications</b></td>
                    <td>
                        <input type="checkbox"> Enable
                    </td>
                </tr>
            </table>
            <br>
            <div style="text-align:center;">
                <input type="submit" value="Save Changes">
                &nbsp;&nbsp;
                <input type="reset" value="Reset">
            </div>
        </form>
    </div>
